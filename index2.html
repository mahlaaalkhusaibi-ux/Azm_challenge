<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f2147">
<title>تحدي عزم للقيم التربوية</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Eczar:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#29203d;--purple:#69238a;--pink:#df3181;--green:#44bd2d;--cream:#fff5df;--paper:#fffaf0;--line:#dac8a6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Alegreya Sans",sans-serif;color:var(--ink);background:#fff5df}
.app-wrapper{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 8% 9%,rgba(223,49,129,.16) 0 2px,transparent 3px),radial-gradient(circle at 91% 19%,rgba(68,189,45,.16) 0 3px,transparent 4px),#fff5df;background-size:34px 34px,42px 42px,auto}
.hero-strip{position:relative;overflow:hidden;background:#2f2147;color:#fff}
.hero-strip::after{content:"";position:absolute;width:340px;height:340px;left:-100px;top:-215px;border:44px solid rgba(223,49,129,.42);border-radius:50%;pointer-events:none}
.hero-title{font-family:"Eczar",serif;letter-spacing:-.04em}
.panel{border:2px solid var(--line);box-shadow:7px 7px 0 rgba(105,35,138,.12);border-radius:1.7rem;padding:1.5rem;background:#fff}
.inp{width:100%;border:2px solid #d9c9ad;background:#fffdf8;border-radius:.75rem;padding:.65rem .9rem;font-size:.9rem;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.85rem;padding:.65rem 1.1rem;font-weight:800;font-size:.9rem;color:#fff;background:var(--purple);transition:.15s;cursor:pointer;border:0}
.btn:hover{filter:brightness(.9)}
.btn.green{background:#44bd2d}.btn.pink{background:#df3181}.btn.gray{background:#6b5f78}.btn.red{background:#c62828}
.btn.sm{padding:.35rem .7rem;font-size:.78rem;border-radius:.6rem}
.lbl{display:block;font-weight:700;font-size:.85rem;margin-bottom:.35rem}
.tab{padding:.55rem 1rem;border-radius:.8rem;font-weight:800;font-size:.85rem;background:#fff;border:2px solid var(--line);cursor:pointer;color:var(--ink)}
.tab.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.score-option{transition:.18s;display:flex;align-items:center;gap:.75rem;border:2px solid #eadfcb;background:#fffdf8;border-radius:1rem;padding:.8rem;cursor:pointer}
.score-option:has(input:checked){border-color:var(--green);background:#f0faeb;transform:translateY(-2px)}
.score-option input{accent-color:var(--green);width:1.15rem;height:1.15rem}
table{border-collapse:collapse;width:100%;text-align:right;font-size:.88rem}
th{background:#2f2147;color:#fff;padding:.7rem;font-weight:800;position:sticky;top:0}
td{padding:.65rem .7rem;border-bottom:1px solid #f0e7d6}
tr.champ{background:linear-gradient(90deg,#fff8d4,#f1faea)}
.bar{height:.9rem;border-radius:99px;background:linear-gradient(90deg,#69238a,#df3181)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:none}
#toast>div{padding:.7rem 1.2rem;border-radius:1rem;color:#fff;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hint{font-size:.78rem;color:#705e75}
</style>
</head>
<body>
<div class="app-wrapper" id="app"></div>
<div id="toast"></div>

<script>
/* ============ ثوابت وأدوات ============ */
const APP_CREDIT = 'الأستاذة مهلاء الخصيبية';
const DB_KEY = 'azm_v2';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const ORD = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const normDigits = s => String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();

/* التاريخ المحلي (تجنّب toISOString لأنه يعطي اليوم السابق بعد منتصف الليل بتوقيت عُمان) */
const fmtDate = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayStr = () => fmtDate(new Date());

/* ============ التخزين (يمكن استبداله لاحقاً بـ Firebase/Supabase) ============ */
let db = loadDB();
function loadDB(){ try{ const d = JSON.parse(localStorage.getItem(DB_KEY)); if(d && d.schools){ Object.values(d.schools).forEach(s => { if(!s.initiative || s.initiative === 'تحدي عزم') s.initiative = 'تحدي عزم للقيم التربوية'; }); return d; } }catch(e){} return {schools:{}, records:[]}; }
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){ toast('تعذر الحفظ: مساحة التخزين ممتلئة','err'); } }

let sess = null;
try{ sess = JSON.parse(sessionStorage.getItem('azm_sess')); }catch(e){}
if(sess && !db.schools[sess.schoolId]) sess = null;

const ui = { tab:'board', period:'month', gradeFilter:'all', editingId:null, entry:newEntry(), draft:null,
             rf:{grade:'all', from:'', to:''}, auth:'login', fails:0, lockUntil:0, lastRows:[] };
function newEntry(){ return {grade:'', section:'', date:todayStr(), checks:{}}; }

const sch = () => db.schools[sess.schoolId];
const isAdmin = () => sess && sess.role === 'admin';
const allRecs = () => db.records.filter(r => r.school_id === sess.schoolId);
const recs = () => allRecs().filter(r => !r.deleted);

/* ============ التشفير البسيط للرمز السري ============ */
async function hashPin(pin, salt){
  const s = salt + ':' + normDigits(pin);
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(const ch of s) h = ((h<<5)+h+ch.charCodeAt(0))|0; return 'f' + h;
}

/* ============ مساعدات المدرسة ============ */
function defaultGrades(){ return [0,1,2,3].map(i => ({id:'g'+(i+1), name:'الصف ' + ORD[i], sections:6})); }
function defaultCriteria(){ return [
  {id:'c1', name:'النظام', desc:'الالتزام بالنظام والقوانين المدرسية', weight:1, color:'#44bd2d'},
  {id:'c2', name:'السلوك', desc:'الأخلاق الحسنة والسلوك الإيجابي', weight:1, color:'#df3181'},
  {id:'c3', name:'النظافة', desc:'نظافة وترتيب المقعد والمحيط الصفي', weight:1, color:'#69238a'}
];}
const maxPts = s => s.criteria.reduce((a,c) => a + c.weight, 0);
const gradeObj = (s, id) => s.grades.find(g => g.id === id);
const className = (s, gid, sec) => (gradeObj(s,gid)?.name || 'صف محذوف') + ' — الشعبة ' + sec;

function periodRange(p, s){
  const now = new Date();
  if(p === 'week'){ const st = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()); const en = new Date(st); en.setDate(st.getDate()+6); return [fmtDate(st), fmtDate(en)]; }
  if(p === 'month'){ return [fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), fmtDate(new Date(now.getFullYear(), now.getMonth()+1, 0))]; }
  if(p === 'term' && s.term.start && s.term.end) return [s.term.start, s.term.end];
  return ['0000-00-00','9999-99-99'];
}
const periodName = p => ({week:'الأسبوع الحالي', month:'الشهر الحالي', term:'الفصل الدراسي', all:'كل الفترات'}[p]);

function aggregate(period, gradeFilter){
  const s = sch(); const [a,b] = periodRange(period, s); const m = new Map();
  recs().filter(r => r.date >= a && r.date <= b && (gradeFilter === 'all' || r.grade === gradeFilter)).forEach(r => {
    const k = r.grade + '|' + r.section;
    if(!m.has(k)) m.set(k, {grade:r.grade, section:r.section, total:0, n:0});
    const o = m.get(k); o.total += r.total; o.n++;
  });
  const mx = maxPts(s) || 1;
  const rows = [...m.values()].map(o => ({...o, pct: Math.round(o.total / (o.n * mx) * 100)}));
  const gi = id => s.grades.findIndex(g => g.id === id);
  rows.sort((x,y) => y.total - x.total || y.pct - x.pct || gi(x.grade) - gi(y.grade) || x.section - y.section);
  rows.forEach((r,i) => { r.rank = (i > 0 && rows[i-1].total === r.total) ? rows[i-1].rank : i + 1; });
  return rows;
}

/* ============ الإشعارات ============ */
let tt;
function toast(msg, type, undoId){
  const t = $('#toast');
  t.innerHTML = '<div style="background:' + (type==='err' ? '#b51f63' : '#2c7d1d') + '">' + esc(msg) +
    (undoId ? ' <button data-act="restore" data-id="' + esc(undoId) + '" style="text-decoration:underline;margin-right:12px;font-weight:800">تراجع</button>' : '') + '</div>';
  t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', undoId ? 7000 : 3500);
}

/* ============ شاشة الدخول والتسجيل ============ */
function loginView(){
  const schools = Object.values(db.schools);
  const tabs = [['login','دخول'],['register','تسجيل مدرسة جديدة'],['import','استيراد ملف مدرسة']];
  let body = '';
  if(ui.auth === 'login'){
    body = schools.length ? `
      <div class="space-y-4">
        <div><label class="lbl">المدرسة</label><select id="lg-school" class="inp">${schools.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div>
        <div><label class="lbl">اسمك (يظهر في سجل الرصد)</label><input id="lg-name" class="inp" placeholder="مثال: أ. فاطمة"></div>
        <div><label class="lbl">الرمز السري (معلم أو إدارة)</label><input id="lg-pin" type="password" inputmode="numeric" class="inp" placeholder="••••"></div>
        <button class="btn w-full" data-act="login">دخول</button>
        <p class="hint text-center">يحدد النظام صلاحيتك تلقائياً من الرمز السري المُدخل.</p>
      </div>` : `<p class="text-center font-bold">لا توجد مدارس على هذا الجهاز بعد. سجّل مدرسة جديدة أو استورد ملف مدرسة.</p>`;
  } else if(ui.auth === 'register'){
    body = `<div class="space-y-4">
      <div><label class="lbl">اسم المدرسة</label><input id="rg-name" class="inp"></div>
      <div><label class="lbl">اسم مدير/ة المدرسة (للشهادات)</label><input id="rg-principal" class="inp"></div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="lbl">الرمز السري للإدارة (4 أرقام فأكثر)</label><input id="rg-admin" type="password" inputmode="numeric" class="inp"></div>
        <div><label class="lbl">الرمز السري للمعلمين</label><input id="rg-teacher" type="password" inputmode="numeric" class="inp"></div>
      </div>
      <button class="btn green w-full" data-act="register">إنشاء المدرسة</button>
      <p class="hint">سيتم إنشاء الصفوف الأربعة والمعايير الثلاثة افتراضياً، ويمكنك تعديلها من الإعدادات.</p></div>`;
  } else {
    body = `<div class="space-y-4"><p class="font-bold text-sm">اختر ملف المدرسة (.json) الذي صدّرته الإدارة، ليعمل على هذا الجهاز بنفس البيانات.</p>
      <input id="imp-file-login" type="file" accept=".json,application/json" class="inp">
      <button class="btn pink w-full" data-act="importLogin">استيراد</button></div>`;
  }
  return `<header class="hero-strip px-5 py-10 text-center"><div class="relative z-10">
      <h1 class="hero-title text-3xl sm:text-4xl font-extrabold">تحدي عزم للقيم التربوية</h1>
      <p class="mt-2 text-[#f9eaf2]">نظام تقييم النظام والسلوك والنظافة — إشراف وتطوير ${APP_CREDIT}</p></div></header>
    <main class="flex-1 px-4 py-8"><div class="mx-auto max-w-lg">
      <div class="flex flex-wrap gap-2 mb-4 justify-center">${tabs.map(t => `<button class="tab ${ui.auth===t[0]?'on':''}" data-act="auth" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>
      <section class="panel">${body}</section></div></main>${footer()}`;
}
const footer = () => `<footer class="w-full bg-[#44bd2d] px-5 py-4 text-center text-white text-sm font-bold">جميع الحقوق محفوظة لمبادرة تحدي عزم — ${APP_CREDIT} © 2026</footer>`;

async function doLogin(){
  if(Date.now() < ui.lockUntil) return toast('محاولات كثيرة خاطئة، انتظر نصف دقيقة', 'err');
  const id = $('#lg-school').value, name = $('#lg-name').value.trim(), pin = $('#lg-pin').value;
  const s = db.schools[id]; if(!s) return;
  if(!pin) return toast('أدخل الرمز السري', 'err');
  const h = await hashPin(pin, s.salt);
  let role = null;
  if(s.adminHash && h === s.adminHash) role = 'admin'; else if(h === s.teacherHash) role = 'teacher';
  if(!role){ ui.fails++; if(ui.fails >= 5){ ui.lockUntil = Date.now() + 30000; ui.fails = 0; } return toast('الرمز السري غير صحيح', 'err'); }
  if(!name) return toast('أدخل اسمك ليظهر في سجل الرصد', 'err');
  ui.fails = 0; startSession(id, role, name);
}
function startSession(schoolId, role, name){
  sess = {schoolId, role, name}; sessionStorage.setItem('azm_sess', JSON.stringify(sess));
  ui.tab = 'board'; ui.entry = newEntry(); ui.editingId = null; render();
}
async function doRegister(){
  const name = $('#rg-name').value.trim(), principal = $('#rg-principal').value.trim();
  const ap = normDigits($('#rg-admin').value), tp = normDigits($('#rg-teacher').value);
  if(!name) return toast('اكتب اسم المدرسة', 'err');
  if(ap.length < 4 || tp.length < 4) return toast('الرمزان يجب ألا يقلا عن 4 خانات', 'err');
  if(ap === tp) return toast('يجب أن يختلف رمز الإدارة عن رمز المعلمين', 'err');
  const salt = uid(), id = 's' + uid();
  db.schools[id] = {id, name, principal, supervisor:'', initiative:'تحدي عزم للقيم التربوية', salt,
    adminHash: await hashPin(ap, salt), teacherHash: await hashPin(tp, salt),
    grades: defaultGrades(), criteria: defaultCriteria(), term:{start:'', end:''}, created_at:new Date().toISOString()};
  saveDB(); startSession(id, 'admin', 'الإدارة'); toast('تم إنشاء المدرسة بنجاح');
}

/* ============ الهيكل الرئيسي ============ */
function mainView(){
  const s = sch();
  const tabs = isAdmin()
    ? [['board','🏆 لوحة الشرف'],['entry','📝 رصد النقاط'],['records','📋 السجلات'],['reports','🎓 التقارير والشهادات'],['settings','⚙️ الإعدادات'],['data','💾 البيانات والنسخ']]
    : [['board','🏆 لوحة الشرف'],['entry','📝 رصد النقاط']];
  const views = {board:boardView, entry:entryView, records:recordsView, reports:reportsView, settings:settingsView, data:dataView};
  return `<header class="hero-strip px-5 py-6"><div class="relative z-10 mx-auto max-w-6xl flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="text-center sm:text-right">
        <div class="inline-flex mb-2 rounded-full bg-[#44bd2d] px-4 py-1 text-sm font-bold">إشراف وتطوير: ${APP_CREDIT}</div>
        <h1 class="hero-title text-2xl sm:text-3xl font-extrabold">${esc(s.initiative || 'تحدي عزم للقيم التربوية')} — ${esc(s.name)}</h1></div>
      <div class="flex items-center gap-3 bg-white/10 p-3 rounded-2xl border border-white/20">
        <span class="text-sm font-bold">${esc(sess.name)} · ${isAdmin() ? 'إدارة' : 'معلم/ة'}</span>
        <button class="btn sm gray" data-act="logout">خروج</button></div></div></header>
    <main class="mx-auto w-full max-w-6xl px-4 py-6 flex-1 space-y-5">
      <nav class="flex flex-wrap gap-2">${tabs.map(t => `<button class="tab ${ui.tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>
      ${(views[ui.tab] || boardView)()}</main>${footer()}`;
}

/* ---- لوحة الشرف ---- */
function periodControls(){
  const s = sch();
  return `<div class="flex flex-wrap gap-2 items-center">
    <select class="inp" style="width:auto" data-model="period">${['week','month','term','all'].map(p => `<option value="${p}" ${ui.period===p?'selected':''}>${periodName(p)}</option>`).join('')}</select>
    <select class="inp" style="width:auto" data-model="gradeFilter"><option value="all">جميع الصفوف</option>${s.grades.map(g => `<option value="${esc(g.id)}" ${ui.gradeFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>`;
}
function boardView(){
  const s = sch(), rows = aggregate(ui.period, ui.gradeFilter); ui.lastRows = rows;
  const total = rows.reduce((a,r) => a + r.total, 0), n = rows.reduce((a,r) => a + r.n, 0);
  const top = rows.filter(r => r.rank === 1).map(r => className(s, r.grade, r.section));
  const mx = rows[0]?.total || 1;
  /* اتجاه آخر 6 أشهر */
  const months = []; const now = new Date();
  for(let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')); }
  const mt = months.map(m => recs().filter(r => r.date.startsWith(m)).reduce((a,r) => a + r.total, 0)); const mmx = Math.max(1, ...mt);
  return `<section class="panel space-y-4">
    <div class="flex flex-wrap justify-between gap-3 items-center"><div><h2 class="font-extrabold text-lg">لوحة الشرف والتميز</h2><p class="hint">الفترة: ${periodName(ui.period)}</p></div>${periodControls()}</div>
    <div class="grid gap-3 sm:grid-cols-4">
      <div class="rounded-2xl bg-[#fff0ae] p-3 border border-[#e8d580]"><div class="text-xs font-extrabold text-[#8c5b00]">👑 المتصدر</div><div class="font-extrabold text-[#69238a] text-sm mt-1">${top.length ? esc(top.join(' ، ')) : '—'}</div></div>
      <div class="rounded-2xl bg-[#e6f7e1] p-3 border border-[#b4e6a8]"><div class="text-xs font-extrabold text-[#2c7d1d]">إجمالي النقاط</div><div class="font-extrabold text-xl">${total}</div></div>
      <div class="rounded-2xl bg-[#f2eafa] p-3 border border-[#d2bfe6]"><div class="text-xs font-extrabold text-[#69238a]">عمليات الرصد</div><div class="font-extrabold text-xl">${n}</div></div>
      <div class="rounded-2xl bg-[#fcf0f6] p-3 border border-[#f0b9d3]"><div class="text-xs font-extrabold text-[#df3181]">الشعب المشاركة</div><div class="font-extrabold text-xl">${rows.length}</div></div></div>
    ${rows.length ? `<div class="overflow-x-auto rounded-2xl border-2 border-[#eadfcb] max-h-[420px]"><table><thead><tr><th>المرتبة</th><th>الصف والشعبة</th><th>النقاط</th><th>عدد الرصد</th><th>نسبة الالتزام</th>${isAdmin()?'<th>شهادة</th>':''}</tr></thead><tbody>
      ${rows.map((r,i) => `<tr class="${r.rank===1?'champ':''}"><td class="font-extrabold text-[#df3181]">${r.rank===1?'👑 ':''}${r.rank}</td><td class="font-bold">${esc(className(s,r.grade,r.section))}</td>
        <td class="font-extrabold text-[#69238a]">${r.total}</td><td>${r.n}</td>
        <td style="min-width:130px"><div class="flex items-center gap-2"><div class="bar" style="width:${Math.max(4,r.pct)}%;max-width:70%"></div><span class="text-xs font-bold">${r.pct}%</span></div></td>
        ${isAdmin()?`<td><button class="btn sm green" data-act="certOne" data-i="${i}">🎓</button></td>`:''}</tr>`).join('')}</tbody></table></div>
      <div><h3 class="font-extrabold mb-2 text-sm">مقارنة النقاط</h3>${rows.slice(0,10).map(r => `<div class="flex items-center gap-2 mb-1.5"><span class="text-xs font-bold w-40 shrink-0">${esc(className(s,r.grade,r.section))}</span><div class="bar" style="width:${Math.max(2,r.total/mx*100)}%"></div><span class="text-xs font-extrabold">${r.total}</span></div>`).join('')}</div>`
      : `<div class="rounded-xl border-2 border-dashed border-[#d9c9ad] p-8 text-center font-extrabold">لا توجد سجلات في هذه الفترة</div>`}

function saveEntry(){
  const s = sch(), e = ui.entry;
  if(!e.grade || !e.section || !e.date) return toast('يرجى اختيار الصف والشعبة والتاريخ', 'err');
  if(e.date > todayStr()) return toast('لا يمكن الرصد بتاريخ مستقبلي', 'err');
  const scores = {}; let total = 0;
  s.criteria.forEach(c => { if(e.checks[c.id]){ scores[c.id] = c.weight; total += c.weight; } });
  if(!total) return toast('اختر معياراً واحداً على الأقل', 'err');
  const now = new Date().toISOString(), sec = Number(e.section);
  const dup = recs().find(r => r.grade === e.grade && r.section === sec && r.date === e.date && r.id !== ui.editingId);
  let target = ui.editingId ? db.records.find(r => r.id === ui.editingId) : null;
  if(dup){
    if(ui.editingId) return toast('يوجد رصد آخر لنفس الشعبة في هذا التاريخ', 'err');
    if(!confirm('تم رصد هذه الشعبة في هذا التاريخ سابقاً (' + dup.total + ' نقطة). هل تريد استبدال الرصد السابق بالجديد؟')) return;
    target = dup;
  }
  if(target){
    (target.history = target.history || []).push({at: target.updated_at || target.created_at, by: target.by, total: target.total});
    Object.assign(target, {grade:e.grade, section:sec, date:e.date, scores, total, updated_at:now, by:sess.name});
  } else {
    db.records.push({id:'r' + uid(), school_id:sess.schoolId, grade:e.grade, section:sec, date:e.date, scores, total, by:sess.name, created_at:now, updated_at:now, deleted:false, history:[]});
  }
  saveDB(); ui.editingId = null; ui.entry = newEntry(); toast('تم حفظ الرصد بنجاح'); render();
}
function startEdit(id){
  const r = db.records.find(x => x.id === id); if(!r || !canEdit(r)) return;
  ui.editingId = id; ui.entry = {grade:r.grade, section:String(r.section), date:r.date, checks:Object.fromEntries(Object.keys(r.scores).map(k => [k, true]))};
  ui.tab = 'entry'; render(); window.scrollTo({top:0, behavior:'smooth'});
}
function delRecord(id){
  const r = db.records.find(x => x.id === id); if(!r || !canEdit(r)) return;
  if(!confirm('هل تريد حذف هذا الرصد؟ (يمكن التراجع)')) return;
  r.deleted = true; r.deleted_at = new Date().toISOString(); r.updated_at = r.deleted_at; saveDB(); render(); toast('تم الحذف', 'ok', id);
}
function restoreRecord(id){
  const r = db.records.find(x => x.id === id); if(!r) return;
  const clash = recs().find(x => x.grade === r.grade && x.section === r.section && x.date === r.date);
  if(clash) return toast('لا يمكن الاسترجاع: يوجد رصد حالي لنفس الشعبة والتاريخ', 'err');
  r.deleted = false; delete r.deleted_at; r.updated_at = new Date().toISOString(); saveDB(); render(); toast('تم استرجاع السجل');
}

}

/* إخراج PDF عبر محرك الطباعة في المتصفح: يدعم العربية واتجاه الكتابة بدقة، واختر "حفظ كـ PDF" */
function printDoc(html, orientation, title){
  const w = window.open('', '_blank');
  if(!w) return toast('المتصفح منع النافذة المنبثقة، اسمح بها ثم أعد المحاولة', 'err');
  w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700;800&family=Eczar:wght@800&display=swap" rel="stylesheet">' +
    '<style>@page{size:A4 ' + orientation + ';margin:0}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0;background:#fff;font-family:"Alegreya Sans",sans-serif;color:#29203d}' +
    '.bar{position:sticky;top:0;background:#2f2147;color:#fff;padding:12px;text-align:center;font-weight:800;z-index:9}.bar button{margin:0 8px;padding:8px 18px;border:0;border-radius:10px;background:#44bd2d;color:#fff;font-weight:800;font-size:15px}' +
    '@media print{.bar{display:none}}</style></head><body><div class="bar">لحفظ الملف: اضغط «حفظ PDF» ثم اختر «حفظ كـ PDF» من نافذة الطباعة <button onclick="window.print()">حفظ PDF</button></div>' + html + '</body></html>');
  w.document.close(); w.focus();
  const go = () => { try{ w.print(); }catch(e){} };
  try{ (w.document.fonts && w.document.fonts.ready ? w.document.fonts.ready : Promise.resolve()).then(() => setTimeout(go, 400)); }catch(e){ setTimeout(go, 1200); }
}

      <div><label class="lbl">بداية الفصل الدراسي</label><input id="st-ts" type="date" class="inp" value="${esc(d.term.start)}"></div>
      <div><label class="lbl">نهاية الفصل الدراسي</label><input id="st-te" type="date" class="inp" value="${esc(d.term.end)}"></div></div>
    <div><div class="flex justify-between items-center mb-2"><h3 class="font-extrabold">الصفوف والشعب</h3><button class="btn sm green" data-act="addGrade">+ صف</button></div>
      <div class="space-y-2">${d.grades.map((g,i) => `<div class="flex gap-2 items-center"><input id="gn${i}" class="inp" value="${esc(g.name)}"><input id="gs${i}" type="number" min="1" max="20" class="inp" style="width:90px" value="${g.sections}" title="عدد الشعب"><span class="hint">شعبة</span><button class="btn sm red" data-act="delGrade" data-i="${i}">✕</button></div>`).join('')}</div></div>
    <div><div class="flex justify-between items-center mb-2"><h3 class="font-extrabold">معايير التقييم</h3><button class="btn sm green" data-act="addCrit">+ معيار</button></div>
      <div class="space-y-2">${d.criteria.map((c,i) => `<div class="flex flex-wrap gap-2 items-center"><input id="cn${i}" class="inp" style="flex:1;min-width:110px" value="${esc(c.name)}" placeholder="الاسم"><input id="cd${i}" class="inp" style="flex:2;min-width:160px" value="${esc(c.desc)}" placeholder="الوصف"><input id="cw${i}" type="number" min="1" max="10" class="inp" style="width:80px" value="${c.weight}" title="الوزن (النقاط)"><button class="btn sm red" data-act="delCrit" data-i="${i}">✕</button></div>`).join('')}</div>
      <p class="hint mt-2">تغيير الوزن لا يؤثر على السجلات القديمة، فهي تحتفظ بنقاطها وقت الرصد.</p></div>
    <div><h3 class="font-extrabold mb-2">تغيير الرموز السرية (اتركها فارغة للإبقاء)</h3><div class="grid sm:grid-cols-2 gap-4">
      <input id="st-ap" type="password" inputmode="numeric" class="inp" placeholder="رمز إدارة جديد"><input id="st-tp" type="password" inputmode="numeric" class="inp" placeholder="رمز معلمين جديد"></div></div>
    <button class="btn w-full" data-act="saveSettings">حفظ الإعدادات</button></section>`;
}
function syncDraft(){
  const d = ui.draft; if(!d || !$('#st-name')) return;
  d.name = $('#st-name').value; d.initiative = $('#st-init').value; d.principal = $('#st-principal').value; d.supervisor = $('#st-sup').value;
  d.term.start = $('#st-ts').value; d.term.end = $('#st-te').value;
  d.grades.forEach((g,i) => { g.name = $('#gn'+i).value; g.sections = Math.max(1, Math.min(20, +$('#gs'+i).value || 1)); });
  d.criteria.forEach((c,i) => { c.name = $('#cn'+i).value; c.desc = $('#cd'+i).value; c.weight = Math.max(1, Math.min(10, +$('#cw'+i).value || 1)); });
}
async function saveSettings(){
  syncDraft(); const d = ui.draft, s = sch();
  if(!d.name.trim()) return toast('اسم المدرسة مطلوب', 'err');
  if(!d.grades.length || !d.criteria.length) return toast('يلزم صف واحد ومعيار واحد على الأقل', 'err');
  if(d.grades.some(g => !g.name.trim()) || d.criteria.some(c => !c.name.trim())) return toast('لا تترك اسماً فارغاً', 'err');
  const ap = normDigits($('#st-ap').value), tp = normDigits($('#st-tp').value);
  if((ap && ap.length < 4) || (tp && tp.length < 4)) return toast('الرمز السري لا يقل عن 4 خانات', 'err');
  const newAdmin = ap ? await hashPin(ap, s.salt) : s.adminHash, newTeacher = tp ? await hashPin(tp, s.salt) : s.teacherHash;
  if(newAdmin === newTeacher) return toast('يجب أن يختلف رمز الإدارة عن رمز المعلمين', 'err');
  Object.assign(s, {name:d.name.trim(), initiative:d.initiative.trim() || 'تحدي عزم للقيم التربوية', principal:d.principal.trim(), supervisor:d.supervisor.trim(), term:d.term, grades:d.grades, criteria:d.criteria, adminHash:newAdmin, teacherHash:newTeacher});
  saveDB(); ui.draft = null; ui.entry = newEntry(); toast('تم حفظ الإعدادات'); render();
}

/* ---- البيانات والنسخ والمزامنة ---- */
function dataView(){
  return `<section class="panel space-y-5"><h2 class="font-extrabold text-lg">البيانات والنسخ الاحتياطي</h2>
    <div class="rounded-2xl bg-[#fff5df] border-2 border-[#dac8a6] p-4 text-sm leading-relaxed">البيانات محفوظة حالياً على هذا الجهاز/المتصفح. لتوحيد رصد عدة معلمين: يصدّر كل معلم «ملف الرصد»، وتستورده الإدارة فتُدمج السجلات تلقائياً دون تكرار. للربط المباشر بين الأجهزة يلزم قاعدة بيانات سحابية (انظر الملاحظة أدناه).</div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="rounded-2xl border-2 border-[#d2bfe6] bg-[#f2eefb] p-4 space-y-3"><h3 class="font-extrabold">⬇️ تصدير</h3>
        <button class="btn w-full" data-act="exportFull">نسخة كاملة (للإدارة)</button>
        <button class="btn w-full" data-act="exportTeacher">ملف للمعلمين (بدون رمز الإدارة)</button></div>
      <div class="rounded-2xl border-2 border-[#b4e6a8] bg-[#f4f9ef] p-4 space-y-3"><h3 class="font-extrabold">⬆️ استيراد ودمج</h3>
        <input id="imp-file" type="file" accept=".json,application/json" class="inp"><button class="btn green w-full" data-act="importMerge">استيراد ودمج</button></div></div>
    <div class="rounded-2xl border-2 border-[#f0b9d3] bg-[#fcf0f6] p-4"><h3 class="font-extrabold mb-2">منطقة الخطر</h3><button class="btn red" data-act="delSchool">حذف المدرسة وبياناتها من هذا الجهاز</button></div></section>`;
}
function exportData(forTeacher){
  const s = JSON.parse(JSON.stringify(sch())); if(forTeacher) s.adminHash = null;
  download((forTeacher ? 'azm-teacher-' : 'azm-full-') + todayStr() + '.json', JSON.stringify({app:'azm', v:2, school:s, records:allRecs()}), 'application/json');
}
function mergeFile(file, cb){
  const rd = new FileReader();
  rd.onload = () => { try{ const d = JSON.parse(rd.result); if(d.app !== 'azm' || !d.school || !Array.isArray(d.records)) throw 0; cb(d); }catch(e){ toast('ملف غير صالح', 'err'); } };
  rd.readAsText(file);
}
function applyImport(d){
  const inc = d.school, cur = db.schools[inc.id];
  if(!cur) db.schools[inc.id] = inc;
  else { // الإبقاء على رمز الإدارة المحلي إذا كان الملف بدونه
    if(!inc.adminHash) inc.adminHash = cur.adminHash;
    if(isAdmin() && sess.schoolId === inc.id){ inc.adminHash = cur.adminHash; inc.teacherHash = cur.teacherHash; inc.name = cur.name; inc.grades = cur.grades; inc.criteria = cur.criteria; inc.term = cur.term; inc.principal = cur.principal; inc.supervisor = cur.supervisor; inc.initiative = cur.initiative; }
    db.schools[inc.id] = inc;
  }
  let added = 0, upd = 0;
  d.records.forEach(r => {
    const i = db.records.findIndex(x => x.id === r.id);
    if(i < 0){ db.records.push(r); added++; }
    else if((r.updated_at || '') > (db.records[i].updated_at || '')){ db.records[i] = r; upd++; }
  });
  saveDB(); return {added, upd, id:inc.id};
}

/* ============ الرسم والأحداث ============ */
function render(){ $('#app').innerHTML = sess ? mainView() : loginView(); }

document.addEventListener('change', e => {
  const m = e.target.dataset && e.target.dataset.model; if(!m) return;
  const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  const p = m.split('.'); let o = ui; for(let i = 0; i < p.length-1; i++) o = o[p[i]]; o[p[p.length-1]] = v;
  if(m === 'entry.grade') ui.entry.section = '';
  render();
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id, i = Number(b.dataset.i), v = b.dataset.v;
  if(sess && ui.tab === 'settings') syncDraft();
  switch(a){
    case 'auth': ui.auth = v; render(); break;
    case 'login': doLogin(); break;
    case 'register': doRegister(); break;
    case 'importLogin': { const f = $('#imp-file-login').files[0]; if(!f) return toast('اختر ملفاً', 'err'); mergeFile(f, d => { applyImport(d); ui.auth = 'login'; render(); toast('تم استيراد المدرسة، يمكنك الدخول الآن'); }); break; }
    case 'logout': sess = null; sessionStorage.removeItem('azm_sess'); ui.auth = 'login'; render(); break;
    case 'tab': ui.tab = v; if(v !== 'entry'){ ui.editingId = null; } if(v !== 'settings') ui.draft = null; render(); break;
    case 'saveEntry': saveEntry(); break;
    case 'cancelEdit': ui.editingId = null; ui.entry = newEntry(); render(); break;
    case 'edit': startEdit(id); break;
    case 'del': delRecord(id); break;
    case 'restore': restoreRecord(id); break;
    case 'emptyTrash': if(confirm('سيتم حذف المحذوفات نهائياً ولا يمكن استرجاعها. متابعة؟')){ db.records = db.records.filter(r => !(r.school_id === sess.schoolId && r.deleted)); saveDB(); render(); } break;
    case 'certOne': { const r = ui.lastRows[i]; if(r) makeCerts([certItem(r, rankText(r.rank))]); break; }
    case 'certTop3': makeCerts(aggregate(ui.period, 'all').filter(r => r.rank <= 3).map(r => certItem(r, rankText(r.rank)))); break;
    case 'certPerGrade': { const s = sch(), items = []; s.grades.forEach(g => { const rows = aggregate(ui.period, g.id); rows.filter(r => r.rank === 1).forEach(r => items.push(certItem(r, 'التفوق الأول في ' + g.name))); }); makeCerts(items); break; }
    case 'reportPdf': reportPdf(); break;
    case 'csvRank': exportCsvRank(); break;
    case 'csvRecs': exportCsvRecs(); break;
    case 'addGrade': ui.draft.grades.push({id:'g' + uid(), name:'صف جديد', sections:4}); render(); break;
    case 'delGrade': { const g = ui.draft.grades[i]; if(ui.draft.grades.length < 2) return toast('يلزم صف واحد على الأقل', 'err');
      if(allRecs().some(r => r.grade === g.id) && !confirm('لهذا الصف سجلات سابقة وستظهر باسم «صف محذوف». متابعة؟')) return; ui.draft.grades.splice(i,1); render(); break; }
    case 'addCrit': ui.draft.criteria.push({id:'c' + uid(), name:'معيار جديد', desc:'', weight:1, color:'#2f7ed8'}); render(); break;
    case 'delCrit': if(ui.draft.criteria.length < 2) return toast('يلزم معيار واحد على الأقل', 'err'); if(confirm('ستبقى نقاط هذا المعيار في السجلات القديمة محسوبة ضمن مجاميعها. متابعة؟')){ ui.draft.criteria.splice(i,1); render(); } break;
    case 'saveSettings': saveSettings(); break;
    case 'exportFull': exportData(false); break;
    case 'exportTeacher': exportData(true); break;
    case 'importMerge': { const f = $('#imp-file').files[0]; if(!f) return toast('اختر ملفاً', 'err');
      mergeFile(f, d => { if(d.school.id !== sess.schoolId) return toast('هذا الملف لمدرسة أخرى', 'err'); const r = applyImport(d); render(); toast('تم الدمج: ' + r.added + ' سجل جديد، ' + r.upd + ' محدّث'); }); break; }
    case 'delSchool': if(confirm('سيتم حذف المدرسة وكل سجلاتها من هذا الجهاز نهائياً. هل صدّرت نسخة احتياطية؟') && confirm('تأكيد أخير: حذف نهائي؟')){
      const id2 = sess.schoolId; db.records = db.records.filter(r => r.school_id !== id2); delete db.schools[id2]; saveDB(); sess = null; sessionStorage.removeItem('azm_sess'); render(); } break;
  }
});

render();
</script>
</body>
</html>
